daemon off;
worker_processes auto;
rtmp_auto_push on;
events {
    worker_connections 1024;
}

# --- RTMP CONFIGURATION (Ingestion Server) ---
rtmp {
    server {
        listen 1935;
        chunk_size 4000;

        # 1. Source ingestion application from OBS
        application src {
            live on;
            
            # Authenticate stream key via main-api webhook
            # Nginx runs in its own container; use the Compose service DNS name,
            # not loopback, for lifecycle callbacks to the API.
            on_publish http://main-api:3000/ingest/on-publish;
            on_publish_done http://main-api:3000/ingest/on-publish-done;

            # Transcode to browser-safe H.264/AAC. repeat-headers and aligned
            # 3-second keyframes ensure every HLS segment can initialize video.
            exec_push ffmpeg -i rtmp://localhost:1935/src/$name
              -map 0:v:0 -map 0:a:0? -c:v libx264 -preset superfast -profile:v main -pix_fmt yuv420p -b:v 2000k -maxrate 2200k -bufsize 4000k -g 90 -keyint_min 90 -sc_threshold 0 -force_key_frames expr:gte(t,n_forced*3) -x264-params keyint=90:min-keyint=90:scenecut=0:repeat-headers=1 -c:a aac -b:a 128k -ar 48000 -s 1280x720 -f flv rtmp://localhost:1935/live/${name}_720
              -map 0:v:0 -map 0:a:0? -c:v libx264 -preset superfast -profile:v main -pix_fmt yuv420p -b:v 1000k -maxrate 1100k -bufsize 2000k -g 90 -keyint_min 90 -sc_threshold 0 -force_key_frames expr:gte(t,n_forced*3) -x264-params keyint=90:min-keyint=90:scenecut=0:repeat-headers=1 -c:a aac -b:a 128k -ar 48000 -s 854x480 -f flv rtmp://localhost:1935/live/${name}_480
              -map 0:v:0 -map 0:a:0? -c:v libx264 -preset superfast -profile:v main -pix_fmt yuv420p -b:v 500k -maxrate 550k -bufsize 1000k -g 90 -keyint_min 90 -sc_threshold 0 -force_key_frames expr:gte(t,n_forced*3) -x264-params keyint=90:min-keyint=90:scenecut=0:repeat-headers=1 -c:a aac -b:a 96k -ar 48000 -s 640x360 -f flv rtmp://localhost:1935/live/${name}_360;
        }

        # 2. HLS packaging application receiving transcoded streams
        application live {
            live on;
            
            # Only allow transcoding processes from localhost to publish here
            allow publish 127.0.0.1;
            deny publish all;
            
            # Enable HLS compiling
            hls on;
            hls_nested on;
            hls_path /app/storage/live;
            hls_fragment 3s;
            hls_playlist_length 60s;
            hls_cleanup on;

            # Define HLS variant playlists for automatically generated Master Playlist
            hls_variant _720 BANDWIDTH=2000000 RESOLUTION=1280x720;
            hls_variant _480 BANDWIDTH=1000000 RESOLUTION=854x480;
            hls_variant _360 BANDWIDTH=500000 RESOLUTION=640x360;
        }
    }
}

# --- HTTP CONFIGURATION (Reverse Proxy & Static Files) ---
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 10m;
    client_body_timeout 15s;

    # Protect expensive unauthenticated operations before they reach the API.
    # The zone is shared by Nginx workers and only keeps a compact per-IP
    # counter; it does not persist application data.
    limit_req_zone $binary_remote_addr zone=auth_requests:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=chat_messages:10m rate=1r/s;

    # ── Upstream: Go Main API ──
    upstream main_api {
        server main-api:3000;
    }

    # ── Upstream: NestJS Chat Service ──
    upstream chat_service {
        server chat-service:3001;
    }

    # ── Upstream: Go Analytics Service ──
    upstream analytics_service {
        server analytics-service:3003;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # ── Global CORS Configuration for API Endpoints ──
        # Nginx will echo the request Origin and allow credentials. Upstreams
        # should not also set Access-Control-* headers (we hide them below).
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;

        # Login, registration and token refresh are common brute-force targets.
        # Keep this separate from ordinary API traffic so active viewers are
        # never throttled by authentication abuse from another client.
        location ~ ^/api/auth/(?:login|register|refresh)$ {
            limit_req zone=auth_requests burst=5 nodelay;
            limit_req_status 429;

            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;

            proxy_pass http://main_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location / {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$http_origin' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            # Ensure upstream CORS headers do not leak through
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;

            proxy_pass http://main_api;

            # Core headers for Real IP passing
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket / SSE connection upgrading
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ── Analytics Service routes ──
        location /api/analytics/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$http_origin' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
                return 204;
            }

            # Hide any CORS headers from upstream and let Nginx set them
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;

            proxy_pass http://analytics_service;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ── Chat Service routes ──
        # Proxy chat endpoints to the NestJS Chat Service
        location /api/rooms {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$http_origin' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
                return 204;
            }

            # Match chat-specific paths and proxy to chat service
            # This uses a nested location for /chat
            location ~ ^/api/rooms/(\d+)/chat$ {
                # This exact chat-message endpoint is separate from the SSE
                # stream below, so long-lived SSE connections are never rate
                # limited. A client may burst briefly, then settles at 1 msg/s.
                limit_req zone=chat_messages burst=10 nodelay;
                limit_req_status 429;

                if ($request_method = 'OPTIONS') {
                    add_header 'Access-Control-Allow-Origin' '$http_origin' always;
                    add_header 'Access-Control-Allow-Credentials' 'true' always;
                    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
                    return 204;
                }

                proxy_pass http://chat_service;
                proxy_hide_header Access-Control-Allow-Origin;
                proxy_hide_header Access-Control-Allow-Credentials;
                proxy_hide_header Access-Control-Allow-Methods;
                proxy_hide_header Access-Control-Allow-Headers;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_http_version 1.1;
                proxy_connect_timeout 60s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
            }

            location ~ ^/api/rooms/(\d+)/chat(/.*)?$ {
                # The nested regex location handles chat requests, so it must
                # answer CORS preflight requests itself instead of forwarding
                # them to NestJS (which has no OPTIONS route).
                if ($request_method = 'OPTIONS') {
                    add_header 'Access-Control-Allow-Origin' '$http_origin' always;
                    add_header 'Access-Control-Allow-Credentials' 'true' always;
                    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
                    add_header 'Access-Control-Max-Age' 1728000;
                    add_header 'Content-Type' 'text/plain; charset=utf-8';
                    add_header 'Content-Length' 0;
                    return 204;
                }

                proxy_pass http://chat_service;

                # Hide upstream CORS headers for SSE/WebSocket endpoints
                proxy_hide_header Access-Control-Allow-Origin;
                proxy_hide_header Access-Control-Allow-Credentials;
                proxy_hide_header Access-Control-Allow-Methods;
                proxy_hide_header Access-Control-Allow-Headers;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                # SSE / WebSocket support
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";

                # Long timeouts for SSE connections
                proxy_connect_timeout 60s;
                proxy_send_timeout 3600s;
                proxy_read_timeout 3600s;

                # Disable buffering for SSE
                proxy_buffering off;
                proxy_cache off;
            }

            # All other /api/rooms/* go to Main API
            # Hide upstream CORS headers when proxying to main API
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;

            proxy_pass http://main_api;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # HLS playlists and transport-stream files must never be cached. The
        # RTMP module reuses segment names after a stream restart; serving an
        # old playlist or segment can leave a player with audio but no decodable
        # video frames.
        location ~ ^/storage/(.+\.(?:m3u8|ts))$ {
            alias /app/storage/$1;

            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }

            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
            add_header Access-Control-Allow-Headers '*' always;
            add_header Cache-Control 'no-store, no-cache, must-revalidate, max-age=0' always;
            add_header Pragma 'no-cache' always;
            expires -1;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Blazing-fast static serving of live HLS files and uploads with CORS enabled
        location /storage/ {
            alias /app/storage/;
            
            # Explicitly force correct MIME types for HLS streams
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
                image/jpeg jpg jpeg;
                image/png png;
            }
            
            # CORS headers required for HLS video player clients
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS';
            add_header Access-Control-Allow-Headers '*';
            
            expires 1d;
        }
    }
}
